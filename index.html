      --text-heading-sm: 28px; --leading-heading-sm: 1.2;  --tracking-heading-sm: -0.56px;
      --text-heading: 36px;    --leading-heading: 1.16;    --tracking-heading: -1.08px;
      --text-heading-lg: 48px; --leading-heading-lg: 1.1;  --tracking-heading-lg: -1.92px;
      --text-display: 68px;    --leading-display: 1.04;    --tracking-display: -4.08px;

      /* Font Weights */
      --font-weight-light: 300;
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-bold: 700;

      /* Spacing (8px base) */
      --spacing-8: 8px;   --spacing-16: 16px;  --spacing-24: 24px;
      --spacing-32: 32px; --spacing-40: 40px;  --spacing-48: 48px;
      --spacing-56: 56px; --spacing-80: 80px;  --spacing-112: 112px;

      /* Layout */
      --page-max-width: 1200px;
      --section-gap: 80px;
      --card-padding: 24px;
      --element-gap: 8px;

      /* Border Radius */
      --radius-icon: 4px;
      --radius-input: 8px;
      --radius-nested: 8px;
      --radius-card: 16px;
      --radius-badge: 100px;
      --radius-pill: 999px;

      /* Surfaces */
      --surface-canvas: #000a06;
      --surface-card: #0a1a14;
      --surface-elevated: #161818;

      /* Shadows */
      --shadow-card: rgba(0,0,0,0.02) 0px 3px 3px 0px, rgba(0,0,0,0.01) 0px 7px 7px 0px, rgba(0,0,0,0.01) 0px 14px 14px 0px, rgba(0,0,0,0.01) 0px 25px 24px 0px;
      --shadow-btn-mint: rgba(1,5,27,0.06) 0px 0px 0px 1px inset;
    }

    body {
      font-family: var(--font-primary);
      background-color: var(--color-deep-forest);
      color: var(--color-paper);
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--color-deep-forest); }
    ::-webkit-scrollbar-thumb { background: #0a3a2b; border-radius: 3px; }

    /* Bloom atmospheric backdrop */
    .bloom-bg {
      background: var(--gradient-bloom);
    }

    /* Reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: all 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Typing cursor */
    .typing-container { display: inline-block; overflow: hidden; white-space: nowrap; }
    .typing-text {
      display: inline-block;
      border-right: 2px solid var(--color-e-mint);
      animation: blink 0.75s step-end infinite;
    }
    @keyframes blink { 50% { border-color: transparent; } }

    /* Mint pill primary button */
    .btn-mint {
      background-color: var(--color-e-mint);
      color: var(--color-deep-forest);
      border-radius: var(--radius-pill);
      font-weight: var(--font-weight-medium);
      font-size: 14px;
      box-shadow: var(--shadow-btn-mint);
      transition: all 0.2s ease;
    }
    .btn-mint:hover { background-color: #a0ffd0; transform: translateY(-1px); }

    /* Ghost outlined button */
    .btn-ghost {
      background-color: transparent;
      color: var(--color-paper);
      border: 1px solid var(--color-paper);
      border-radius: var(--radius-pill);
      font-weight: var(--font-weight-medium);
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .btn-ghost:hover { background-color: rgba(255,255,255,0.08); transform: translateY(-1px); }

    /* Nav link underline */
    .nav-link { position: relative; }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 1px;
      background: var(--color-e-mint);
      transition: width 0.2s ease;
    }
    .nav-link:hover::after { width: 100%; }

    /* Status pulse dot */
    .status-dot {
      background-color: var(--color-e-mint);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Skill bar */
    .skill-bar { position: relative; height: 4px; background: rgba(122,255,180,0.12); border-radius: 2px; overflow: hidden; }
    .skill-bar-fill {
      position: absolute; left: 0; top: 0; height: 100%;
      border-radius: 2px;
      background: var(--color-e-mint);
      transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ─────────────────────────────────────────────
       THEME TRANSITION — smooth colour shifts
    ───────────────────────────────────────────── */
    *, *::before, *::after {
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }
    /* exclude animations from transition so they still work */
    .reveal, .animate-bounce, .animate-spin, .status-dot {
      transition: opacity 0.65s cubic-bezier(0.16,1,0.3,1), transform 0.65s cubic-bezier(0.16,1,0.3,1), background-color 0.3s ease;
    }

    /* ─────────────────────────────────────────────
       LIGHT MODE OVERRIDES
       Applied when html[data-theme="light"]
       Accessibility target: WCAG AA contrast on all text
    ───────────────────────────────────────────── */

    /* Base */
    html[data-theme="light"] body {
      background-color: #f5fff9;
      color: #0a1a14;
    }

    html[data-theme="light"] ::-webkit-scrollbar-thumb { background: #007a4a; border-radius: 3px; }

    /* ── Section backgrounds ── */
    /* alternating: deep-forest sections → very light mint, pine-bark sections → white */
    html[data-theme="light"] .bg-deep-forest { background-color: #f0fdf6 !important; }
    html[data-theme="light"] .bg-pine-bark   { background-color: #ffffff !important; }
    html[data-theme="light"] .bg-charcoal    { background-color: #e6f7ee !important; }

    html[data-theme="light"] .bg-deep-forest\/95 { background-color: rgba(240,253,246,0.96) !important; }

    html[data-theme="light"] .border-e-mint  { border-color: #007a4a !important; }

    html[data-theme="light"] .text-paper       { color: #0a1a14 !important; }

    html[data-theme="light"] .text-ash         { color: #2e5247 !important; }

    /* text-deep-forest: used on badges over mint-whisper bg → stays dark ink */
    html[data-theme="light"] .text-deep-forest { color: #0a1a14 !important; }

    /* ── THE KEY FIX: Electric Mint text → dark accessible green ── */
    /* #7affb4 has <1.5:1 contrast on white. Use #007a4a (7:1 on white) */
    html[data-theme="light"] .text-e-mint { color: #007a4a !important; }

    /* ── Accent UI elements that use mint color ── */
    /* Nav link hover underline → dark green */
    html[data-theme="light"] .nav-link::after { background: #007a4a !important; }
    /* Typing cursor blink → dark green */
    html[data-theme="light"] .typing-text { border-right-color: #007a4a !important; }
    /* Available status dot → dark green */
    html[data-theme="light"] .status-dot { background-color: #007a4a !important; }
    /* Skill bar fill → dark green */
    html[data-theme="light"] .skill-bar-fill { background: #007a4a !important; }
    /* Skill bar track → light mint */

    html[data-theme="light"] .btn-ghost {

    html[data-theme="light"] input:focus,

      justify-content: center;
      font-size: 11px;
      transition: left 0.3s cubic-bezier(0.34,1.56,0.64,1), background 0.3s ease;
    }
  </style>

            if (entry.isIntersecting) entry.target.classList.add('active');

        }, { threshold: 0.05 });

            const rect = el.getBoundingClientRect();
            const inView = rect.top < window.innerHeight && rect.bottom > 0;
            if (inView) {
              el.classList.add('active');
            } else {
              el.classList.remove('active');
              observer.observe(el);
            }
          });
        }, 50);

                      <label className="block text-ash text-sm font-medium mb-2">Your Email</label>
                      <input type="email" required value={formData.email} onChange={(e) => setFormData({ ...formData, email: e.target.value })} className="w-full px-4 py-3 bg-pine-bark text-paper border border-abyssal rounded-[8px] focus:outline-none focus:border-e-mint transition-all placeholder-ash" placeholder="pavanhegade06@gmail.com" />
                    </div>

                    <div>
                      <label className="block text-ash text-sm font-medium mb-2">Message</label>
                      <textarea required rows={4} value={formData.message} onChange={(e) => setFormData({ ...formData, message: e.target.value })} className="w-full px-4 py-3 bg-pine-bark text-paper border border-abyssal rounded-[8px] focus:outline-none focus:border-e-mint transition-all resize-none placeholder-ash" placeholder="Write your message here..."></textarea>
                    </div>

                    {error && (
                      <div className="px-4 py-3 rounded-[8px] bg-charcoal border border-abyssal text-ash text-sm">
                        ⚠️ {error}
                      </div>
                    )}

                    <button type="submit" disabled={sending} className={`w-full btn-mint py-4 text-base flex items-center justify-center gap-2 ${sending ? 'opacity-60 cursor-not-allowed' : ''}`}>
                      {sending ? (
                        <>
                          <svg className="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                          </svg>
                          Sending...
                        </>
                      ) : (
                        <>
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                          </svg>
                          Send Message
                        </>
                      )}
                    </button>
                  </form>
                )}
              </div>
            </div>
          </div>
        </section>
      );
    };

    const Footer = () => {
      return (
        <footer className="py-8 bg-deep-forest border-t border-abyssal">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-[10px] bg-pine-bark border border-abyssal flex items-center justify-center text-paper font-bold text-sm">
                  {studentData.initials}
                </div>
                <span className="text-ash text-sm">© {new Date().getFullYear()} {studentData.name}. All rights reserved.</span>
              </div>

              <div className="flex items-center gap-6">
                <a href={studentData.socials.linkedin} target="_blank" rel="noopener noreferrer" className="text-smoke hover:text-e-mint transition-colors" aria-label="LinkedIn">
                  <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                  </svg>
                </a>
                <a href={studentData.socials.github} target="_blank" rel="noopener noreferrer" className="text-smoke hover:text-e-mint transition-colors" aria-label="GitHub">
                  <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                  </svg>
                </a>
                <a href={`mailto:${studentData.email}`} className="text-smoke hover:text-e-mint transition-colors" aria-label="Email">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                </a>
              </div>
            </div>
          </div>
        </footer>
      );
    };

    const App = () => {
      const [isDark, setIsDark] = useState(() => {
        try {
          const saved = localStorage.getItem('pavan-theme');
          return saved ? saved === 'dark' : true;
        } catch { return true; }
      });

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        try { localStorage.setItem('pavan-theme', isDark ? 'dark' : 'light'); } catch {}
      }, [isDark]);

      const toggleTheme = () => setIsDark(prev => !prev);

      return (
        <div className="min-h-screen">
          <Navbar isDark={isDark} toggleTheme={toggleTheme} />
          <Hero />
          <About />
          <Skills />
          <Experience />
          <Projects />
          <Education />
          <Certifications />
          <CTA />
          <Contact />
          <Footer />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
